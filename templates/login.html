<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar sesión
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container">

    <div
        class="row justify-content-center align-items-center"
        style="min-height: 100vh;"
    >

        <div class="col-md-5 col-lg-4">

            <div class="card shadow">

                <div class="card-header bg-dark text-white text-center">

                    <h3 class="mb-0">
                        Sistema de Ferretería
                    </h3>

                </div>


                <div class="card-body p-4">

                    <h5 class="text-center mb-4">
                        Iniciar sesión
                    </h5>


                    {% with mensajes = get_flashed_messages(with_categories=true) %}

                        {% if mensajes %}

                            {% for categoria, mensaje in mensajes %}

                                <div class="alert alert-{{ categoria }}">
                                    {{ mensaje }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

                        <div class="mb-3">

                            <label
                                for="nombre_usuario"
                                class="form-label"
                            >
                                Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre_usuario"
                                name="nombre_usuario"
                                required
                                autofocus
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Ingresar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
